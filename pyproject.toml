[project]
name = "exroute"
version = "0.1.0"
description = "Motorcycle route planning from natural language prompts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.143.0",
    "httpx2>=2.13.1",
    "openai>=3.28.0",
    "polyline>=2.0.4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.14.0",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.4",
]
